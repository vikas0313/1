<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍜</text></svg>" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta id="theme-color-meta" name="theme-color" content="#F3EFE7" />
  <title>Ritsu Food Corner | Indo-Chinese Dining</title>
  <meta name="description"
    content="Indo-Chinese ka asli maza – Ritsu ke saath! Order directly from your table via QR code." />

  <!-- DM Sans Typography (Self-hosted or Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&display=swap"
    rel="stylesheet" />

  <!-- Zero-FOUT Theme Resolution Script -->
  <script>
    (function () {
      try {
        var isOwner = window.location.pathname.startsWith('/owner');
        var key = isOwner ? 'ritsu-theme-owner' : 'ritsu-theme';
        var stored = localStorage.getItem(key) || localStorage.getItem('ritsu-theme-customer') || 'system';
        var isDark = stored === 'dark' || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = isDark ? 'dark' : 'light';

        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        var meta = document.getElementById('theme-color-meta');
        if (meta) {
          meta.setAttribute('content', isDark ? '#171514' : '#F3EFE7');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body class="antialiased bg-[var(--bg)] text-[var(--text)]">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
